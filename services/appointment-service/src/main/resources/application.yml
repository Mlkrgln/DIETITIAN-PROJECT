spring:
  application:
    name: appointment-service
  datasource:
    url: ${APPOINTMENT_DB_URL:jdbc:postgresql://localhost:5432/appointment_db}
    username: ${APPOINTMENT_DB_USERNAME:postgres}
    password: ${APPOINTMENT_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
server:
  port: ${SERVER_PORT:8082}
app:
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info
