spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/customer_db}
    username: ${CUSTOMER_DB_USERNAME:postgres}
    password: ${CUSTOMER_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
server:
  port: ${SERVER_PORT:8081}
app:
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info
