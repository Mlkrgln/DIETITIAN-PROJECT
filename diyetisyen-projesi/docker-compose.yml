services:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: dietitian_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - dietitian-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - dietitian-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - dietitian-network

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - dietitian-network

  auth:
    build:
      context: ./auth
    container_name: auth
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
      - kafka
    networks:
      - dietitian-network

  customer:
    build:
      context: ./customer
    container_name: customer
    ports:
      - "8081:8081"
    depends_on:
      - auth
      - postgres
      - rabbitmq
      - kafka
    networks:
      - dietitian-network

  appointment:
    build:
      context: ./appointment
    container_name: appointment
    ports:
      - "8082:8082"
    depends_on:
      - auth
      - customer
      - postgres
      - rabbitmq
      - kafka
    networks:
      - dietitian-network

  dietlist:
    build:
      context: ./dietlist
    container_name: dietlist
    ports:
      - "8083:8083"
    depends_on:
      - auth
      - customer
      - postgres
      - rabbitmq
      - kafka
    networks:
      - dietitian-network

  notification:
    build:
      context: ./notification
    container_name: notification
    ports:
      - "8084:8084"
    depends_on:
      - auth
      - customer
      - appointment
      - dietlist
      - postgres
      - rabbitmq
      - kafka
    networks:
      - dietitian-network

networks:
  dietitian-network:
    driver: bridge