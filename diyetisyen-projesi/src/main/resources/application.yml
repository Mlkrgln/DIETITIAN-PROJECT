spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/diyetisyen}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    # ❌ dialect BURADAN KALDIRILDI
    # Hibernate, PostgreSQL driver’dan zaten doğru dialect’i seçecek

    open-in-view: false

  main:
    allow-bean-definition-overriding: true

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET}
    exp-ms: 86400000
